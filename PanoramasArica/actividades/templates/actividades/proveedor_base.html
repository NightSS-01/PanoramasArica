{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block titulo %}Portal proveedor{% endblock %} · Panoramas Arica</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'style.css' %}">
  <link rel="stylesheet" href="{% static 'actividades/proveedor.css' %}">
</head>
<body class="proveedor-body">
  <header class="proveedor-header">
    <div class="proveedor-header__marca">
      <span class="proveedor-logo">P</span>
      <div>
        <small class="proveedor-header__etiqueta">PORTAL PROVEEDOR</small>
        <div class="proveedor-header__nombre">Panoramas Arica</div>
      </div>
    </div>
    <div class="proveedor-header__cuenta">
      <div class="text-end">
        <div class="proveedor-header__org">Norte Vivo Experiencias</div>
        <small class="text-muted">Cuenta proveedor</small>
      </div>
      <span class="proveedor-avatar">NV</span>
    </div>
  </header>

  <main class="proveedor-main">
    {% block contenido %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
