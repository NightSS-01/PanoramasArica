{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block titulo %}Panoramas Arica{% endblock %}</title>
  <link rel="icon" href="{% static '#' %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static './style.css' %}">
  <link rel="stylesheet" href="{% static './detalle.css' %}">
  <link rel="stylesheet" href="{% static './soporte.css' %}">
</head>
  <body class="d-flex flex-column min-vh-100">
    <header class="sticky-top">{% include 'includes/navbar.html' %}</header>
    {% block hero %}
    {% endblock %}
  <main class="container py-4 flex-grow-1">
    {% block contenido %}{% endblock %}
  </main>
  {% include 'includes/footer.html' %}
  {% include 'includes/soporte.html' %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
