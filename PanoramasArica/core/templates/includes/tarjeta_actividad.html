{% load static %}
<article class="tarjeta">
  <div class="tarjeta__imagen" style="background-image: url('{% static a.imagen %}')">
    <span class="tarjeta__badge {{ a.badge_clase }}">{{ a.badge }}</span>
    <span class="tarjeta__lugar"><i class="bi bi-geo-alt"></i> {{ a.lugar }}</span>
  </div>

  <div class="tarjeta__cuerpo">
    <div class="tarjeta__meta">
      <span><i class="bi bi-calendar3"></i> {{ a.fecha }}</span>
      <span><i class="bi bi-clock"></i> {{ a.horario }}</span>
    </div>

    <h3 class="tarjeta__titulo">{{ a.titulo }}</h3>
    <p class="tarjeta__texto">{{ a.descripcion }}</p>

    <div class="tarjeta__pie">
      <div>
        <small class="tarjeta__desde">Desde</small>
        <p class="tarjeta__precio">{{ a.precio }} {% if a.moneda %}<span>{{ a.moneda }}</span>{% endif %}</p>
      </div>
      <a href="{% url 'detalle' a.id %}" class="tarjeta__flecha" aria-label="Ver detalles de {{ a.titulo }}"><i class="bi bi-arrow-right"></i></a>
    </div>

    <div class="tarjeta__cupos">
      <span><i class="bi bi-people"></i> {{ a.cupos }} cupos disponibles</span>
      <span class="tarjeta__punto"></span>
    </div>
  </div>
</article>
