<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>
</head>
<body>

    <!-- Contenedor principal -->
    <div>
        <!-- Encabezado -->
        <div>
            <h2>Crear una cuenta</h2>
            <p>Completa el formulario para registrarte en la plataforma.</p>
        </div>

        <!-- Formulario de Registro -->
        <form action="/register" method="POST">
            <!-- Campo de Nombre Completo -->
            <div>
                <label for="fullname">Nombre completo:</label>
                <input type="text" id="fullname" name="fullname" required>
            </div>

            <br>

            <!-- Campo de Correo Electrónico -->
            <div>
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <br>

            <!-- Campo de Contraseña -->
            <div>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" minlength="8" required>
            </div>

            <br>

            <!-- Campo de Confirmar Contraseña -->
            <div>
                <label for="confirm-password">Confirmar contraseña:</label>
                <input type="password" id="confirm-password" name="confirm_password" minlength="8" required>
            </div>

            <br>

            <!-- Términos y Condiciones -->
            <div>
                <label>
                    <input type="checkbox" name="terms" required> Acepto los <a href="/terminos">Términos de servicio</a> y la <a href="/privacidad">Política de privacidad</a>
                </label>
            </div>

            <br>

            <!-- Botón de envío -->
            <button type="submit">Registrarse</button>
        </form>

        <br>

        <!-- Enlace para volver al inicio de sesión -->
        <div>
            <p>¿Ya tienes una cuenta? <a href="/login">Inicia sesión aquí</a></p>
        </div>
    </div>

</body>
</html>
